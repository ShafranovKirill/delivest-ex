version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: delivest-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - delivest-network

  s3:
    image: chrislusf/seaweedfs
    container_name: delivest-s3
    restart: always
    command: "server -s3 -s3.port=${S3_PORT:-8333} -dir=/data"
    ports:
      - "${S3_PORT_EXTERNAL:-8333}:${S3_PORT:-8333}"
      - "${S3_CONSOLE_PORT_EXTERNAL:-9333}:9333"
    environment:
      - S3_USER=${S3_USER}
      - S3_PASSWORD=${S3_PASSWORD}
    volumes:
      - s3_data:/data
    networks:
      - delivest-network

  filer:
    image: chrislusf/seaweedfs
    container_name: delivest-filer
    restart: always
    command: "filer -master=${S3_HOST:-s3}:9333"
    ports:
      - "8888:8888"
    depends_on:
      - s3
    networks:
      - delivest-network

networks:
  delivest-network:
    driver: bridge

volumes:
  postgres_data:
  s3_data:
