version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: delivest-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - delivest-network

  s3:
    image: chrislusf/seaweedfs
    container_name: delivest-s3
    restart: always
    # S3 requires the S3_ACCESS_KEY/S3_SECRET_KEY credentials for any write or listing.
    # Anonymous visitors can only read objects from the public bucket (S3_BUCKET).
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities": [
          {"name": "delivest",
           "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
           "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
          {"name": "anonymous", "actions": ["Read:$$S3_BUCKET"]}
        ]}
        JSON
        exec weed server -s3 -s3.port=$$S3_PORT -s3.config=/etc/seaweedfs/s3.json -dir=/data
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-delivest}
      - S3_PORT=${S3_PORT:-8333}
    # Bound to localhost: expose it publicly through the reverse proxy (S3_PUBLIC_HOST).
    # Set S3_BIND_ADDRESS=0.0.0.0 only if the S3 port must be reachable directly.
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_PORT_EXTERNAL:-8333}:${S3_PORT:-8333}"
    volumes:
      - s3_data:/data
    networks:
      - delivest-network

networks:
  delivest-network:
    driver: bridge

volumes:
  postgres_data:
  s3_data:
